<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Garena Free Fire Team</title>


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;

            background: #2b2b2b;

            color: #ffffff;

            overflow-x: hidden;
        }


        body {
            margin: 0;
            padding: 0;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            width: 100%;
            height: 82px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    #86d2ed,
                    #65bfe0
                );

            box-shadow:
                0 3px 8px rgba(0,0,0,.25);
        }


        .header h1 {

            margin: 0;
            padding: 0;

            color: #ffffff;

            font-size: 27px;
            line-height: 1;

            font-weight: 800;

            text-align: center;

            text-shadow:
                0 2px 4px rgba(0,0,0,.30);
        }


        /* =========================================
           MAIN
        ========================================= */

        .main {

            width: 100%;
            max-width: 680px;

            margin: 0 auto;
            padding: 0;

            display: flex;
            flex-direction: column;

            align-items: stretch;
        }


        /* =========================================
           WATCH FULL VIDEO
        ========================================= */

        .watch-title {

            width: 100%;

            margin: 0;

            /*
             सिर्फ ऊपर का layout spacing
             */

            padding:
                34px 8px 18px;

            color: #ffffff;

            font-size: 27px;
            line-height: 1;

            font-weight: 800;

            letter-spacing: 1px;

            text-align: center;
        }


        /* =========================================
           VIDEO
        ========================================= */

        .video-box {

            width: 100%;

            margin: 0;
            padding: 0;

            aspect-ratio: 16 / 9;

            background: #000000;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 8px 20px rgba(0,0,0,.45);
        }


        .video-box video {

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: #000000;

            object-fit: contain;
        }


        /* =========================================
           DIAMOND CARD

           VIDEO और CARD के बीच सिर्फ 8px
        ========================================= */

        .diamond-card {

            width: 100%;

            margin:
                8px 0 0 0;

            padding: 3px;

            flex: none;

            border-radius: 22px;

            background:
                linear-gradient(
                    45deg,
                    #ff0000,
                    #ff7300,
                    #fffb00,
                    #48ff00,
                    #00ffd5,
                    #002bff,
                    #7a00ff,
                    #ff00c8,
                    #ff0000
                );

            background-size: 400% 400%;

            animation:
                rgbAnimation 10s linear infinite;

            box-shadow:
                0 12px 28px rgba(0,0,0,.50);
        }


        /* =========================================
           RGB ANIMATION
        ========================================= */

        @keyframes rgbAnimation {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* =========================================
           CARD INNER
        ========================================= */

        .card-inner {

            width: 100%;

            margin: 0;

            padding:
                14px 13px;

            background: #111111;

            border-radius: 19px;

            display: flex;

            flex-direction: column;

            min-height: 0;
        }


        /* =========================================
           BADGES
        ========================================= */

        .badges {

            width: 100%;

            margin:
                0 0 8px 0;

            padding: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;
        }


        .badge {

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                7px 15px;

            border-radius: 20px;

            color: #ffffff;

            font-size: 13px;
            line-height: 1;

            font-weight: 800;
        }


        .new {

            background: #ff3b48;
        }


        .premium {

            background: #6955ee;
        }


        /* =========================================
           PRODUCT
        ========================================= */

        .product {

            width: 100%;

            margin: 0;
            padding: 0;

            display: flex;

            align-items: center;

            gap: 11px;
        }


        /* =========================================
           CLICKABLE PRODUCT IMAGE
        ========================================= */

        .product-link {

            display: block;

            width: 92px;
            height: 92px;

            min-width: 92px;

            flex: 0 0 92px;

            margin: 0;
            padding: 0;

            text-decoration: none;
        }


        .product-image {

            display: block;

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border-radius: 16px;

            object-fit: cover;

            background: #222222;
        }


        /* =========================================
           PRODUCT INFORMATION
        ========================================= */

        .product-info {

            min-width: 0;

            margin: 0;
            padding: 0;
        }


        .product-title {

            margin:
                0 0 7px 0;

            padding: 0;

            color: #ffffff;

            font-size: 24px;

            line-height: 1.05;

            font-weight: 800;

            white-space: nowrap;
        }


        .product-desc {

            margin: 0;
            padding: 0;

            color: #aaaaaa;

            font-size: 14px;

            line-height: 1.4;
        }


        /* =========================================
           STARS
        ========================================= */

        .stars {

            margin:
                5px 0 0 0;

            padding: 0;

            color: #ffd000;

            font-size: 20px;

            line-height: 1;

            letter-spacing: 2px;
        }


        /* =========================================
           CLAIM FREE DIAMOND BUTTON
        ========================================= */

        .claim-btn {

            width: 100%;

            height: 64px;

            margin:
                12px 0 0 0;

            padding: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    #00f084,
                    #00d86f
                );

            color: #ffffff;

            text-decoration: none;

            font-size: 21px;

            line-height: 1;

            font-weight: 900;

            text-transform: uppercase;

            box-shadow:
                0 5px 18px
                rgba(0,230,120,.45);

            cursor: pointer;

            transition:
                transform .15s ease,
                filter .15s ease;
        }


        .claim-btn:hover {

            filter: brightness(1.05);
        }


        .claim-btn:active {

            transform:
                scale(.97);
        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 380px) {


            .header {

                height: 70px;
            }


            .header h1 {

                font-size: 22px;
            }


            .watch-title {

                margin: 0;

                padding:
                    22px 5px 12px;

                font-size: 22px;
            }


            .video-box {

                border-radius: 15px;
            }


            /* सिर्फ 8px gap */

            .diamond-card {

                margin:
                    8px 0 0 0;

                padding: 3px;

                border-radius: 19px;
            }


            .card-inner {

                padding:
                    10px 11px;

                border-radius: 16px;
            }


            .badges {

                gap: 7px;

                margin-bottom: 7px;
            }


            .badge {

                padding:
                    5px 12px;

                font-size: 11px;
            }


            .product {

                gap: 9px;
            }


            .product-link {

                width: 72px;
                height: 72px;

                min-width: 72px;

                flex-basis: 72px;
            }


            .product-image {

                border-radius: 13px;
            }


            .product-title {

                margin-bottom: 5px;

                font-size: 20px;
            }


            .product-desc {

                font-size: 11px;

                line-height: 1.35;
            }


            .stars {

                margin-top: 3px;

                font-size: 17px;
            }


            .claim-btn {

                height: 55px;

                margin-top: 9px;

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="header">

        <h1>
            Garena Free Fire Team
        </h1>

    </header>



    <!-- ======================================
         MAIN
    ======================================= -->

    <main class="main">


        <!-- WATCH FULL VIDEO -->

        <h2 class="watch-title">
            WATCH FULL VIDEO
        </h2>



        <!-- ==================================
             VIDEO
        ================================== -->

        <section class="video-box">

            <video
                controls
                playsinline
                preload="metadata"
            >

                <source
                    src="lv_0_20260901124625.mp4"
                    type="video/mp4"
                >

                Your browser does not support
                the video tag.

            </video>

        </section>



        <!-- ==================================
             FREE DIAMONDS
             ONLY 8px FROM VIDEO
        ================================== -->

        <section class="diamond-card">


            <div class="card-inner">


                <!-- BADGES -->

                <div class="badges">

                    <span class="badge new">
                        NEW
                    </span>

                    <span class="badge premium">
                        PREMIUM
                    </span>

                </div>



                <!-- PRODUCT -->

                <div class="product">


                    <!-- CLICKABLE PHOTO -->

                    <a
                        href="CLAIM_URL"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="product-link"
                    >

                        <img
                            class="product-image"
                            src="garena-free-fire-diamonds-file-e63b6767.jpg.webp"
                            alt="Free Diamonds"
                        >

                    </a>



                    <!-- PRODUCT INFO -->

                    <div class="product-info">


                        <div class="product-title">
                            FREE DIAMONDS
                        </div>


                        <div class="product-desc">

                            FREE FIRE UNLIMITED<br>

                            DIAMONDS • INSTANT CLAIM

                        </div>


                        <div class="stars">
                            ★★★★★
                        </div>


                    </div>


                </div>



                <!-- ==================================
                     CLAIM BUTTON
                ================================== -->

                <a
                    class="claim-btn"
                    href="CLAIM_URL"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    💎 Claim Free Diamond 

                </a>


            </div>


        </section>


    </main>


</body>

</html>
