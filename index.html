<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Garena Free Fire Team</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#292929;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

/* MAIN MOBILE FRAME */
.page{
    width:100%;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* HEADER */
.header{
    height:17%;
    min-height:105px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        180deg,
        #73cceb,
        #58b7d9
    );

    box-shadow:0 3px 7px rgba(0,0,0,.55);
}

.header h1{
    width:100%;
    text-align:center;

    font-size:clamp(27px,7vw,39px);
    font-weight:800;

    white-space:nowrap;

    text-shadow:
        0 3px 4px rgba(0,0,0,.45);
}

/* CONTENT */
.content{
    width:100%;
    height:83%;

    padding:6vh 38px 20px;

    overflow:hidden;
}

/* WATCH TITLE */
.watch-title{
    text-align:center;

    font-size:clamp(28px,8vw,40px);
    line-height:1;

    font-weight:800;

    white-space:nowrap;

    margin-bottom:5vh;
}

/* VIDEO */
.video-box{
    width:100%;
    aspect-ratio:16 / 9;

    border-radius:27px;

    overflow:hidden;
    background:#000;

    box-shadow:
        0 9px 25px rgba(0,0,0,.55);
}

.video-box video{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}

/* CARD */
.card{
    position:relative;

    width:100%;

    margin-top:6vh;

    padding:26px 38px 24px;

    background:#101010;

    border-radius:34px;

    box-shadow:
        0 12px 28px rgba(0,0,0,.5);

    overflow:hidden;
}

/* COLOURED BORDER */
.card::before{
    content:"";

    position:absolute;
    inset:0;

    padding:5px;

    border-radius:34px;

    background:
        linear-gradient(
            135deg,
            #ff1700,
            #ff7b00,
            #f5ef00,
            #00df5a,
            #00c8ff,
            #7000ff
        );

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;
    mask-composite:exclude;

    pointer-events:none;
}

/* BADGES */
.badges{
    display:flex;
    justify-content:center;
    align-items:center;

    gap:13px;

    margin-bottom:14px;
}

.badge{
    padding:9px 21px;

    border-radius:25px;

    font-size:17px;
    font-weight:800;
}

.new{
    background:#ff454c;
}

.premium{
    background:#6c5be8;
}

/* PRODUCT ROW */
.product{
    display:flex;
    align-items:center;

    gap:25px;
}

/* DIAMOND IMAGE */
.product-image{
    width:125px;
    height:125px;

    min-width:125px;

    object-fit:cover;

    border-radius:23px;

    display:block;
}

/* PRODUCT TEXT */
.product-info{
    min-width:0;
}

.product-title{
    font-size:36px;

    line-height:1;

    font-weight:500;

    margin-bottom:12px;

    white-space:nowrap;
}

.description{
    color:#aaa;

    font-size:21px;

    line-height:1.35;
}

.stars{
    color:#ffd21b;

    font-size:28px;

    margin-top:10px;

    letter-spacing:2px;
}

/* GREEN BUTTON */
.claim-button{
    width:100%;

    margin-top:34px;

    padding:19px 8px;

    border:0;
    border-radius:55px;

    background:
        linear-gradient(
            90deg,
            #00f084,
            #00d56e
        );

    color:white;

    font-size:27px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,255,130,.25);
}

.claim-button:active{
    transform:scale(.98);
}

/* SMALL UNOFFICIAL LABEL */
.unofficial{
    text-align:center;

    color:#777;

    font-size:9px;

    margin-top:7px;
}


/* MOBILE */
@media(max-width:430px){

    .header{
        height:16%;
        min-height:90px;
    }

    .header h1{
        font-size:29px;
    }

    .content{
        height:84%;

        padding:
            5vh
            38px
            10px;
    }

    .watch-title{
        font-size:32px;
        margin-bottom:4.5vh;
    }

    .video-box{
        border-radius:24px;
    }

    .card{
        margin-top:5vh;

        padding:
            20px
            20px
            18px;

        border-radius:30px;
    }

    .card::before{
        border-radius:30px;
    }

    .badges{
        gap:10px;
    }

    .badge{
        font-size:14px;
        padding:8px 17px;
    }

    .product{
        gap:17px;
    }

    .product-image{
        width:105px;
        height:105px;
        min-width:105px;
        border-radius:21px;
    }

    .product-title{
        font-size:28px;
    }

    .description{
        font-size:16px;
    }

    .stars{
        font-size:22px;
        margin-top:7px;
    }

    .claim-button{
        margin-top:23px;

        padding:15px 5px;

        font-size:22px;
    }
}


/* SHORT MOBILE SCREENS */
@media(max-height:700px){

    .header{
        height:14%;
        min-height:70px;
    }

    .content{
        height:86%;
        padding-top:3vh;
    }

    .watch-title{
        font-size:28px;
        margin-bottom:2.5vh;
    }

    .video-box{
        aspect-ratio:16 / 8.5;
    }

    .card{
        margin-top:3vh;
        padding:15px 18px;
    }

    .product-image{
        width:82px;
        height:82px;
        min-width:82px;
    }

    .product-title{
        font-size:23px;
    }

    .description{
        font-size:13px;
    }

    .stars{
        font-size:18px;
    }

    .claim-button{
        margin-top:15px;
        padding:11px;
        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <header class="header">
        <h1>Garena Free Fire Team</h1>
    </header>


    <main class="content">

        <!-- TITLE -->
        <h2 class="watch-title">
            WATCH FULL VIDEO
        </h2>


        <!-- VIDEO -->
        <section class="video-box">

            <video
                controls
                playsinline
                preload="metadata">

                <source
                    src="lv_0_20260901124625.mp4"
                    type="video/mp4">

                Your browser does not support
                the video element.

            </video>

        </section>


        <!-- DIAMOND CARD -->
        <section class="card">

            <div class="badges">

                <span class="badge new">
                    NEW
                </span>

                <span class="badge premium">
                    PREMIUM
                </span>

            </div>


            <div class="product">

                <img
                    class="product-image"
                    src="garena-free-fire-diamonds-file-e63b6767.jpg.webp"
                    alt="Free Fire Diamonds">

                <div class="product-info">

                    <div class="product-title">
                        FREE DIAMONDS
                    </div>

                    <div class="description">
                        FREE FIRE UNLIMITED<br>
                        DIAMONDS · INSTANT CLAIM
                    </div>

                    <div class="stars">
                        ★★★★★
                    </div>

                </div>

            </div>


            <!-- BUTTON -->
            <button
                class="claim-button"
                type="button"
                onclick="openLink()">

                GET FREE DIAMOND

            </button>


            <div class="unofficial">
                Unofficial fan-made page
            </div>

        </section>

    </main>

</div>


<script>
function openLink(){

    window.open(
        "https://www.1024tera.com/wap/share/filelist?surl=49i0kz-yeLmF-1C4MmI00Q",
        "_blank",
        "noopener,noreferrer"
    );

}
</script>

</body>
</html>
