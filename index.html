<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Free Fire Team - Demo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #292929;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   MAIN MOBILE FRAME
========================= */

.page {
    width: 100%;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* =========================
   HEADER
========================= */

.header {
    flex: 0 0 12%;

    min-height: 65px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 10px;

    background:
        linear-gradient(
            180deg,
            #70c9e9,
            #58b6da
        );

    box-shadow:
        0 3px 7px rgba(0,0,0,.45);
}

.header h1 {
    width: 100%;

    text-align: center;

    font-size: clamp(24px, 7vw, 38px);

    line-height: 1;

    font-weight: 800;

    white-space: nowrap;

    text-shadow:
        0 3px 4px rgba(0,0,0,.45);
}


/* =========================
   CONTENT
========================= */

.content {
    flex: 1;

    width: 100%;
    max-width: 520px;

    margin: 0 auto;

    padding:
        3.5vh
        clamp(15px, 5vw, 38px)
        2vh;

    display: flex;
    flex-direction: column;

    overflow: hidden;
}


/* =========================
   TITLE
========================= */

.title {
    flex: 0 0 auto;

    text-align: center;

    font-size: clamp(26px, 7vw, 40px);

    line-height: 1;

    font-weight: 800;

    margin-bottom: 3.5vh;

    white-space: nowrap;
}


/* =========================
   VIDEO
========================= */

.video-box {
    width: 100%;

    height: min(39vh, 330px);

    background: #000;

    border-radius: 24px;

    overflow: hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);

    flex-shrink: 1;
}

.video-box video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =========================
   CARD
========================= */

.offer-card {
    position: relative;

    width: 100%;

    margin-top: 3.5vh;

    padding:
        2.5vh
        clamp(20px, 6vw, 40px)
        2vh;

    background: #101010;

    border-radius: 28px;

    overflow: hidden;

    flex-shrink: 1;

    box-shadow:
        0 8px 25px rgba(0,0,0,.5);
}


/* Rainbow border */

.offer-card::before {
    content: "";

    position: absolute;

    inset: 0;

    padding: 4px;

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            #ff1600,
            #ff8b00,
            #e7ef00,
            #00d75a,
            #00b7ff,
            #7600ff
        );

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;

    mask-composite: exclude;

    pointer-events: none;
}


/* =========================
   BADGES
========================= */

.badges {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-bottom: 1.5vh;
}

.badge {
    padding:
        7px 18px;

    border-radius: 20px;

    font-size: clamp(13px, 4vw, 18px);

    font-weight: 800;
}

.new {
    background: #ff454b;
}

.premium {
    background: #6857e9;
}


/* =========================
   CARD CONTENT
========================= */

.offer-content {
    display: flex;

    align-items: center;

    gap: clamp(12px, 4vw, 25px);
}


/* =========================
   ICON
========================= */

.offer-icon {
    width: clamp(75px, 25vw, 120px);

    min-width: clamp(75px, 25vw, 120px);

    height: clamp(75px, 25vw, 120px);

    border-radius: 20px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    font-size: clamp(12px, 4vw, 18px);

    font-weight: 900;

    background:
        radial-gradient(
            circle,
            #5ceaff 0%,
            #0878b9 42%,
            #122039 78%
        );

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.5);
}


/* =========================
   TEXT
========================= */

.offer-info {
    min-width: 0;
}

.offer-title {
    font-size: clamp(23px, 7vw, 37px);

    line-height: 1;

    font-weight: 500;

    margin-bottom: 8px;

    white-space: nowrap;
}

.offer-description {
    color: #aaa;

    font-size: clamp(13px, 4.5vw, 22px);

    line-height: 1.25;
}

.stars {
    margin-top: 8px;

    color: #ffd21c;

    font-size: clamp(19px, 6vw, 29px);

    letter-spacing: 1px;
}


/* =========================
   BUTTON
========================= */

.get-diamond {
    width: 100%;

    border: none;

    margin-top: 2.5vh;

    padding: clamp(13px, 2.5vh, 21px) 10px;

    border-radius: 50px;

    background:
        linear-gradient(
            90deg,
            #00ef82,
            #00d06b
        );

    color: #fff;

    font-size: clamp(20px, 6vw, 29px);

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 7px 20px rgba(0,255,130,.2);
}

.get-diamond:active {
    transform: scale(.98);
}


/* =========================
   DEMO TEXT
========================= */

.demo {
    text-align: center;

    color: #777;

    font-size: 9px;

    margin-top: 7px;
}


/* =========================
   VERY SMALL HEIGHT
========================= */

@media (max-height: 650px) {

    .header {
        flex-basis: 11%;
    }

    .content {
        padding-top: 2vh;
    }

    .title {
        margin-bottom: 2vh;
        font-size: 27px;
    }

    .video-box {
        height: 32vh;
    }

    .offer-card {
        margin-top: 2vh;
        padding-top: 1.5vh;
    }

    .offer-icon {
        width: 72px;
        min-width: 72px;
        height: 72px;
    }

    .offer-title {
        font-size: 23px;
    }

    .offer-description {
        font-size: 13px;
    }

    .stars {
        font-size: 18px;
    }

    .get-diamond {
        margin-top: 1.5vh;
        padding: 11px;
        font-size: 21px;
    }
}
</style>
</head>


<body>

<div class="page">


    <!-- HEADER -->

    <header class="header">
        <h1>Garena Free Fire Team</h1>
    </header>



    <!-- CONTENT -->

    <main class="content">


        <!-- TITLE -->

        <h2 class="title">
            WATCH FULL VIDEO
        </h2>



        <!-- VIDEO -->

        <section class="video-box">

            <video
                controls
                playsinline
                preload="metadata">

                <source
                    src="lv_0_20260901124625.mp4"
                    type="video/mp4">

                Your browser does not support
                the video tag.

            </video>

        </section>



        <!-- CARD -->

        <section class="offer-card">


            <!-- BADGES -->

            <div class="badges">

                <span class="badge new">
                    NEW
                </span>

                <span class="badge premium">
                    PREMIUM
                </span>

            </div>



            <!-- CONTENT -->

            <div class="offer-content">


                <div class="offer-icon">
                    FREE<br>
                    FIRE<br>
                    💎
                </div>


                <div class="offer-info">

                    <div class="offer-title">
                        FREE DIAMONDS
                    </div>

                    <div class="offer-description">
                        FREE FIRE UNLIMITED<br>
                        DIAMONDS · INSTANT CLAIM
                    </div>

                    <div class="stars">
                        ★★★★★
                    </div>

                </div>

            </div>



            <!-- BUTTON -->

            <button
                class="get-diamond"
                type="button"
                onclick="window.open(
                'https://www.1024tera.com/wap/share/filelist?surl=49i0kz-yeLmF-1C4MmI00Q',
                '_blank',
                'noopener,noreferrer'
                )">

                GET FREE DIAMOND

            </button>


            <div class="demo">
                Demo landing page
            </div>


        </section>


    </main>

</div>


</body>
</html>
